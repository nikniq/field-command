name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python edition (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cairo headers (pycairo builds from source on Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev pkg-config
      - name: Install
        run: python -m pip install numpy pytest pygame pycairo
      - name: Simulation tests
        working-directory: linux
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests -q -rfE --tb=short 2>&1 | tee pytest.txt || {
            # Failures as annotations, readable through the checks API without a log token.
            grep -E "^(FAILED|ERROR|E  |[a-z_/]+\.py:[0-9]+: )" pytest.txt | head -40 | sed 's/^/::error::/'
            tail -n 25 pytest.txt | sed 's/^/::error::tail: /'
            exit 1
          }
      - name: Cross-edition parity
        run: python -m pytest tests -q

  windows-exe:
    name: Windows executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: windows
        run: python -m pip install -r requirements.txt
      - name: Build
        working-directory: windows
        run: python build_exe.py --no-server
      - name: The exe starts and reports its version
        working-directory: windows
        run: |
          $out = & .\dist\FieldCommand.exe --version 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch "Field Command \d") { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: FieldCommand-windows
          path: windows/dist/*.exe

  macos:
    name: macOS edition
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build
        working-directory: macos
        # Compiler errors are re-emitted as workflow annotations, which the API exposes without a log token.
        run: |
          set +e
          swift build -c release 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          grep -E "error:" build.log | sort -u | head -30 | sed 's/^/::error::/'
          exit $status
      # One step per hook, so a failure names itself in the job's step list.
      - name: Locate binary
        working-directory: macos
        run: echo "BIN=$(swift build -c release --show-bin-path)/FieldCommand" >> "$GITHUB_ENV"
      - name: Headless World
        working-directory: macos
        run: |
          set -o pipefail
          FC_WORLDTEST=1 "$BIN" | tee /dev/stderr | grep -q "WORLD TEST PASSED"
      - name: Headless Repair
        working-directory: macos
        run: |
          set -o pipefail
          FC_REPAIRTEST=1 "$BIN" | tee /dev/stderr | grep -q "REPAIR TEST PASSED"
      - name: Headless Teams
        working-directory: macos
        run: |
          set -o pipefail
          FC_TEAMSTEST=1 "$BIN" | tee /dev/stderr | grep -q "TEAMS TEST PASSED"
      - name: Headless Siege
        working-directory: macos
        run: |
          set -o pipefail
          FC_SIEGETEST=1 "$BIN" | tee /dev/stderr | grep -q "SIEGE TEST PASSED"
      - name: Headless Upgrades
        working-directory: macos
        run: |
          set -o pipefail
          FC_UPGRADETEST=1 "$BIN" | tee /dev/stderr | grep -q "UPGRADE TEST PASSED"
      - name: Headless Towers
        working-directory: macos
        run: |
          set -o pipefail
          FC_TOWERTEST=1 "$BIN" | tee /dev/stderr | grep -q "TOWER TEST PASSED"
      - name: Headless Store
        working-directory: macos
        run: |
          set -o pipefail
          FC_STORETEST=1 "$BIN" | tee /dev/stderr | grep -q "STORE TEST PASSED"
      - name: Headless AI
        working-directory: macos
        run: |
          set -o pipefail
          FC_AITEST=1 "$BIN" | tee /dev/stderr | grep -q "AI TEST PASSED"
      - name: Headless Audio
        working-directory: macos
        run: |
          set -o pipefail
          FC_AUDIOTEST=1 "$BIN" | tee /dev/stderr | grep -q "AUDIO TEST PASSED"
      - name: Headless Medics
        working-directory: macos
        run: |
          set -o pipefail
          FC_MEDICTEST=1 "$BIN" | tee /dev/stderr | grep -q "MEDIC TEST PASSED"
      - name: Headless Pings
        working-directory: macos
        run: |
          set -o pipefail
          FC_PINGTEST=1 "$BIN" | tee /dev/stderr | grep -q "PING TEST PASSED"
      - name: Headless Artillery
        working-directory: macos
        run: |
          set -o pipefail
          FC_ARTYTEST=1 "$BIN" | tee /dev/stderr | grep -q "ARTILLERY TEST PASSED"
      - name: Headless Campaign
        working-directory: macos
        run: |
          set -o pipefail
          FC_CAMPAIGNTEST=1 "$BIN" | tee /dev/stderr | grep -q "CAMPAIGN TEST PASSED"
      - name: Headless Replay
        working-directory: macos
        run: |
          set -o pipefail
          FC_REPLAYTEST=1 "$BIN" | tee /dev/stderr | grep -q "REPLAY TEST PASSED"
      - name: Headless High Ground
        working-directory: macos
        run: |
          set -o pipefail
          FC_HIGHTEST=1 "$BIN" | tee /dev/stderr | grep -q "HIGH GROUND TEST PASSED"
      - name: Headless Polish
        working-directory: macos
        run: |
          set -o pipefail
          FC_POLISHTEST=1 "$BIN" | tee /dev/stderr | grep -q "POLISH TEST PASSED"
      - name: Headless Walls
        working-directory: macos
        run: |
          set -o pipefail
          FC_WALLTEST=1 "$BIN" | tee /dev/stderr | grep -q "WALL TEST PASSED"
      - name: Headless Air
        working-directory: macos
        run: |
          set -o pipefail
          FC_AIRTEST=1 "$BIN" | tee /dev/stderr | grep -q "AIR TEST PASSED"
      - name: Headless Modes
        working-directory: macos
        run: |
          set -o pipefail
          FC_MODETEST=1 "$BIN" | tee /dev/stderr | grep -q "MODE TEST PASSED"
      - name: Headless Start
        working-directory: macos
        run: |
          set -o pipefail
          FC_STARTTEST=1 "$BIN" | tee /dev/stderr | grep -q "START TEST PASSED"
      - name: Headless Abilities
        working-directory: macos
        run: |
          set -o pipefail
          FC_ABILITYTEST=1 "$BIN" | tee /dev/stderr | grep -q "ABILITY TEST PASSED"
      - name: Headless Crates
        working-directory: macos
        run: |
          set -o pipefail
          FC_CRATETEST=1 "$BIN" | tee /dev/stderr | grep -q "CRATE TEST PASSED"
      - name: Headless Bridges
        working-directory: macos
        run: |
          set -o pipefail
          FC_BRIDGETEST=river_crossing "$BIN" | tee /dev/stderr | grep -q "BRIDGE TEST PASSED"
      - name: Headless Save
        working-directory: macos
        run: |
          set -o pipefail
          FC_SAVETEST=1 FC_SAVE_FIXTURE="$GITHUB_WORKSPACE/tests/fixtures/save_python.json" "$BIN" | tee /dev/stderr | grep -q "SAVE TEST PASSED"
      - name: App bundle
        working-directory: macos
        run: ./build_app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FieldCommand-macos
          path: macos/build/Field Command.app

  rpm:
    name: Fedora RPM
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: dnf install -y rpm-build make python3-devel python3-cairo desktop-file-utils libappstream-glib git
      - name: Build
        working-directory: linux
        run: make rpm
      - uses: actions/upload-artifact@v4
        with:
          name: field-command-rpm
          path: linux/rpmbuild/RPMS/noarch/*.rpm
