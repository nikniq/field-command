name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python edition (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cairo headers (pycairo builds from source on Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev pkg-config
      - name: Install
        run: python -m pip install numpy pytest pygame pycairo
      - name: Simulation tests
        working-directory: linux
        run: python -m pytest tests -q
      - name: Cross-edition parity
        run: python -m pytest tests -q

  windows-exe:
    name: Windows executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: windows
        run: python -m pip install -r requirements.txt
      - name: Build
        working-directory: windows
        run: python build_exe.py --no-server
      - name: The exe starts and reports its version
        working-directory: windows
        run: |
          $out = & .\dist\FieldCommand.exe --version 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch "Field Command \d") { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: FieldCommand-windows
          path: windows/dist/*.exe

  macos:
    name: macOS edition
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build
        working-directory: macos
        run: swift build -c release
      - name: Headless tests
        working-directory: macos
        run: |
          BIN="$(swift build -c release --show-bin-path)/FieldCommand"
          set -o pipefail
          FC_WORLDTEST=1  "$BIN" | tee /dev/stderr | grep -q "WORLD TEST PASSED"
          FC_REPAIRTEST=1 "$BIN" | tee /dev/stderr | grep -q "REPAIR TEST PASSED"
          FC_TEAMSTEST=1  "$BIN" | tee /dev/stderr | grep -q "TEAMS TEST PASSED"
          FC_SIEGETEST=1  "$BIN" | tee /dev/stderr | grep -q "SIEGE TEST PASSED"
          FC_UPGRADETEST=1 "$BIN" | tee /dev/stderr | grep -q "UPGRADE TEST PASSED"
          FC_TOWERTEST=1 "$BIN" | tee /dev/stderr | grep -q "TOWER TEST PASSED"
          FC_STORETEST=1 "$BIN" | tee /dev/stderr | grep -q "STORE TEST PASSED"
          FC_AITEST=1 "$BIN" | tee /dev/stderr | grep -q "AI TEST PASSED"
          FC_AUDIOTEST=1 "$BIN" | tee /dev/stderr | grep -q "AUDIO TEST PASSED"
          FC_MEDICTEST=1 "$BIN" | tee /dev/stderr | grep -q "MEDIC TEST PASSED"
          FC_PINGTEST=1 "$BIN" | tee /dev/stderr | grep -q "PING TEST PASSED"
          FC_ARTYTEST=1 "$BIN" | tee /dev/stderr | grep -q "ARTILLERY TEST PASSED"
          FC_BRIDGETEST=river_crossing "$BIN" | tee /dev/stderr | grep -q "BRIDGE TEST PASSED"
          FC_SAVETEST=1 FC_SAVE_FIXTURE="$GITHUB_WORKSPACE/tests/fixtures/save_python.json" "$BIN" | tee /dev/stderr | grep -q "SAVE TEST PASSED"
      - name: App bundle
        working-directory: macos
        run: ./build_app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FieldCommand-macos
          path: macos/build/Field Command.app

  rpm:
    name: Fedora RPM
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: dnf install -y rpm-build make python3-devel python3-cairo desktop-file-utils libappstream-glib git
      - name: Build
        working-directory: linux
        run: make rpm
      - uses: actions/upload-artifact@v4
        with:
          name: field-command-rpm
          path: linux/rpmbuild/RPMS/noarch/*.rpm
